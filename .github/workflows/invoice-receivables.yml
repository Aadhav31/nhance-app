name: Invoice receivables checks
on:
  pull_request:
    paths:
      - 'src/pages/reports/**'
      - 'src/pages/sales/SalesPage.jsx'
      - 'src/pages/projects/ProjectsPage.jsx'
      - 'src/lib/invoiceReceivables*'
      - 'src/lib/report*.js'
      - 'src/lib/dailyActivity*.js'
      - 'tests/dailyActivity*'
      - 'tests/reports*'
      - 'tests/invoiceReceivables*'
      - 'tests/projectReceivables.browser.mjs'
      - '.github/workflows/invoice-receivables.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      RECEIVABLES_ARTIFACT_DIR: test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npx eslint src/pages/reports/ReportsPage.jsx src/pages/reports/InvoiceReceivablesReport.jsx src/pages/sales/SalesPage.jsx src/pages/projects/ProjectsPage.jsx src/lib/invoiceReceivables.js src/lib/invoiceReceivablesExport.js tests/invoiceReceivables.test.js tests/invoiceReceivablesExport.test.js src/pages/reports/ReportViewer.jsx src/lib/reportCatalog.js src/lib/reportData.js src/lib/reportModels.js src/lib/reportExport.js tests/reports.test.js
      - run: npx eslint src/lib/dailyActivity.js src/lib/dailyActivityExport.js src/pages/reports/DailyActivityReport.jsx tests/dailyActivity.test.js tests/dailyActivity.fixture.mjs tests/dailyActivity.browser.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/reports.browser.mjs
      - run: node tests/dailyActivity.browser.mjs
      - run: node tests/invoiceReceivables.browser.mjs
      - run: node tests/projectReceivables.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-receivables-verification
          path: test-artifacts
