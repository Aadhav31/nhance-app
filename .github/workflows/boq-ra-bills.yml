name: BOQ RA billing checks
on:
  pull_request:
    paths:
      - src/pages/boq/BOQPage.jsx
      - src/pages/ra_billing/RABillingPage.jsx
      - src/components/shared/RaiseRABillModal.jsx
      - src/components/shared/OverlayDialog.jsx
      - tests/boqRABills.browser.mjs
      - .github/workflows/boq-ra-bills.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/boqRABills.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boq-ra-preview
          path: test-artifacts/boq-ra
