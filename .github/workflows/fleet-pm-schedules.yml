name: Fleet PM schedule checks
on:
  pull_request:
    paths:
      - src/pages/fleet/FleetPage.jsx
      - src/pages/maintenance/PreventiveMaintenanceTab.jsx
      - src/pages/maintenance/WorkshopBoardTab.jsx
      - src/components/shared/OverlayDialog.jsx
      - src/lib/preventiveMaintenance.js
      - tests/preventiveMaintenance.test.js
      - tests/fleetPmSchedules.browser.mjs
      - .github/workflows/fleet-pm-schedules.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/fleetPmSchedules.browser.mjs
      - run: node tests/fleetJobCards.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-pm-preview
          path: test-artifacts/fleet-pm
