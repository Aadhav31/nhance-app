name: Fleet fuel correction checks
on:
  pull_request:
    paths:
      - src/pages/fleet/FleetPage.jsx
      - src/components/shared/PagePanel.jsx
      - src/components/shared/EntityPicker.jsx
      - tests/fleetFuelEdit.browser.mjs
      - .github/workflows/fleet-fuel-edit.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/fleetFuelEdit.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-fuel-preview
          path: test-artifacts/fleet-fuel
