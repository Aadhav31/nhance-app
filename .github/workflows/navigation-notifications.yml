name: Navigation and notification checks
on:
  pull_request:
    paths:
      - src/components/layout/**
      - src/hooks/useApprovalBadge.js
      - src/hooks/useNotifications.js
      - src/lib/notifications.js
      - src/components/shared/HomeNotificationAlerts.jsx
      - src/pages/dashboard/DashboardPage.jsx
      - src/pages/operator/OperatorPortal.jsx
      - supabase/migrations/*_notification_inbox.sql
      - tests/notificationInbox.database.mjs
      - src/App.jsx
      - tests/navigationNotifications.browser.mjs
      - .github/workflows/navigation-notifications.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2 @electric-sql/pglite@0.5.8
      - run: node tests/notificationInbox.database.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/navigationNotifications.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-preview
          path: test-artifacts/navigation
